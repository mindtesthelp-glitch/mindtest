  function calculateScores() {
    var raw = {}, maxs = {};
    MOVIE_AXES.forEach(function(a) { raw[a.id] = 0; maxs[a.id] = 0; });

    MOVIE_ALL_QUESTIONS.forEach(function(q, qIdx) {
      var arr = state.answers[qIdx] || [];
      var isMulti = !!q.multi;
      var isOrder = q.type === 'order';

      MOVIE_AXES.forEach(function(axis) {
        var vals = q.a.map(function(v) { return (v.v && v.v[axis.id]) || 0; }).sort(function(x, y) { return y - x; });
        var maxForQ;
        if (isMulti) {
          maxForQ = 0;
          var take = q.multi || 1;
          for (var i = 0; i < take; i++) maxForQ += (vals[i] || 0);
        } else {
          maxForQ = vals[0] || 0;
        }
        maxs[axis.id] += maxForQ;
      });

      if (!arr || arr.length === 0) return;

      if (isOrder) {
        var firstIdx = arr[0];
        MOVIE_AXES.forEach(function(axis) {
          raw[axis.id] += (q.a[firstIdx].v && q.a[firstIdx].v[axis.id]) || 0;
        });
      } else {
        arr.forEach(function(idx) {
          MOVIE_AXES.forEach(function(axis) {
            raw[axis.id] += (q.a[idx].v && q.a[idx].v[axis.id]) || 0;
          });
        });
      }
    });

    var scores = {};
    MOVIE_AXES.forEach(function(a) {
      var v = maxs[a.id] > 0 ? (raw[a.id] / maxs[a.id]) * 100 : 0;
      if (v > 100) v = 100;
      if (v < 0) v = 0;
      scores[a.id] = Math.round(v);
    });
    return scores;
  }

  function collectFlags() {
    var flags = {
      no_horror: false, want_horror: false,
      no_romance: false, want_romance: false,
      only_rus: false, short: false,
      want_modern: false, want_classic: false,
      want_scifi: false, want_fantasy: false,
      want_detective: false, want_action: false, want_comedy: false, want_drama: false,
      region: null
    };

    MOVIE_ALL_QUESTIONS.forEach(function(q, qIdx) {
      var arr = state.answers[qIdx] || [];
      arr.forEach(function(idx) {
        var ans = q.a[idx];
        if (!ans) return;
        if (ans.flags) {
          Object.keys(ans.flags).forEach(function(k) { if (ans.flags[k]) flags[k] = true; });
        }
        if (q.q.indexOf('Какой жанр') !== -1) {
          var tGenre = ans.t;
          if (tGenre.indexOf('Научное') !== -1) flags.want_scifi = true;
          if (tGenre.indexOf('Фэнтези') !== -1) flags.want_fantasy = true;
          if (tGenre.indexOf('Детектив') !== -1) flags.want_detective = true;
          if (tGenre.indexOf('Боевик') !== -1) flags.want_action = true;
          if (tGenre.indexOf('Комедия') !== -1) flags.want_comedy = true;
          if (tGenre.indexOf('Драма') !== -1) flags.want_drama = true;
        }
        if (q.q.indexOf('какой страны') !== -1) {
          var t = ans.t;
          if (t.indexOf('США') !== -1) flags.region = 'west';
          else if (t.indexOf('Корея') !== -1) flags.region = 'asia';
          else if (t.indexOf('Европа') !== -1) flags.region = 'europe';
          else if (t.indexOf('Россия') !== -1) flags.region = 'rus';
          else if (t.indexOf('Турция') !== -1) flags.region = 'other';
        }
        if (q.q.indexOf('классику') !== -1) {
          var t2 = ans.t;
          if (t2.indexOf('предпочитаю новое') !== -1 || t2.indexOf('Не смотрю') !== -1) flags.want_modern = true;
          else if (t2.indexOf('регулярно') !== -1) flags.want_classic = true;
        }
        if (q.q.indexOf('страшного') !== -1 || q.q.indexOf('боишься страшного') !== -1) {
          var t3 = ans.t;
          if (t3.indexOf('жуть') !== -1 || (t3.indexOf('Люблю') !== -1 && t3.indexOf('нервы') !== -1)) flags.want_horror = true;
        }
      });
    });

    return flags;
  }

  function determineMovie(scores, flags) {
    var base = MOVIE_RESULTS.filter(function(m) {
      if (flags.no_horror && isHorror(m.id)) return false;
      if (flags.no_romance && isRomance(m.id)) return false;
      if (flags.only_rus && !isRus(m.id)) return false;
      if (flags.short && isLong(m.id)) return false;
      return true;
    });
    if (base.length === 0) base = MOVIE_RESULTS.slice();

    if (flags.region) {
      var byRegion = base.filter(function(m) { return getRegion(m) === flags.region; });
      if (byRegion.length > 0) base = byRegion;
      else base = [];
    }

    if (base.length === 0) {
      base = MOVIE_RESULTS.filter(function(m) {
        if (flags.no_horror && isHorror(m.id)) return false;
        if (flags.no_romance && isRomance(m.id)) return false;
        if (flags.only_rus && !isRus(m.id)) return false;
        if (flags.short && isLong(m.id)) return false;
        return true;
      });
    }

    var wantGenres = [];
    if (flags.want_scifi) wantGenres.push('scifi');
    if (flags.want_fantasy) wantGenres.push('fantasy');
    if (flags.want_detective) wantGenres.push('detective');
    if (flags.want_action) wantGenres.push('action');
    if (flags.want_comedy) wantGenres.push('comedy');
    if (flags.want_drama) wantGenres.push('drama');

    if (wantGenres.length > 0) {
      var byGenre = base.filter(function(m) {
        var g = m.genre || [];
        if (Array.isArray(g)) {
          for (var i = 0; i < g.length; i++) {
            if (wantGenres.indexOf(g[i]) !== -1) return true;
          }
        }
        if (wantGenres.indexOf('scifi') !== -1 && isScifi(m.id)) return true;
        if (wantGenres.indexOf('fantasy') !== -1 && isFantasy(m.id)) return true;
        if (wantGenres.indexOf('detective') !== -1 && isDetective(m.id)) return true;
        if (wantGenres.indexOf('action') !== -1 && isAction(m.id)) return true;
        if (wantGenres.indexOf('comedy') !== -1 && isComedy(m.id)) return true;
        if (wantGenres.indexOf('drama') !== -1 && (m.profile.D >= 75)) return true;
        return false;
      });
      if (byGenre.length > 0) base = byGenre;
    }

    var eraFilter = flags.want_modern ? 'modern' : (flags.want_classic ? 'classic' : null);
    var horrorFilter = flags.want_horror;

    function applySoft(list, useEra, useHorror) {
      return list.filter(function(m) {
        if (useEra && eraFilter === 'modern' && !isModern(m)) return false;
        if (useEra && eraFilter === 'classic' && isModern(m)) return false;
        if (useHorror && horrorFilter && !isHorror(m.id)) return false;
        return true;
      });
    }

    var candidates = base;
    var attempts = [
      applySoft(base, true, true),
      applySoft(base, true, false),
      applySoft(base, false, true),
      base
    ];
    for (var i = 0; i < attempts.length; i++) {
      if (attempts[i].length > 0) { candidates = attempts[i]; break; }
    }

    var ranked = candidates.map(function(m) {
      var dot = 0, magA = 0, magB = 0;
      MOVIE_AXES.forEach(function(a) {
        var u = (scores[a.id] || 0) + 1;
        var v = (m.profile[a.id] || 0) + 1;
        dot += u * v;
        magA += u * u;
        magB += v * v;
      });
      var sim = dot / (Math.sqrt(magA) * Math.sqrt(magB));
      var match = Math.round(sim * 100);
      if (match > 99) match = 99;
      if (match < 45) match = 45;
      return { movie: m, sim: sim, match: match };
    }).sort(function(a, b) { return b.sim - a.sim; });

    return {
      best: ranked[0].movie,
      bestMatch: ranked[0].match,
      also: ranked.slice(1, Math.min(4, ranked.length))
    };
  }

    document.getElementById('startBtn').addEventListener('click', function() {
      state.screen = 'question';
      state.current = 0;
      renderQuestion();
      scrollTop();
    });
  }

  function renderQuestion() {
    var q = MOVIE_ALL_QUESTIONS[state.current];
    var total = MOVIE_ALL_QUESTIONS.length;
    var pct = (state.current / total) * 100;
    var isMulti = !!q.multi;
    var isOrder = q.type === 'order';
    var selected = state.answers[state.current] || [];

    var html = '';
    html += '<div class="test-topbar">';
    html +=   '<div>Вопрос <b>' + (state.current + 1) + '</b> из ' + total + '</div>';
    html +=   '<div>Кино</div>';
    html += '</div>';
    html += '<div class="test-progress"><div class="test-progress-fill" style="width:' + pct + '%"></div></div>';
    html += '<div class="q-card">';
    html +=   '<span class="q-num">Вопрос ' + (state.current + 1) + '</span>';
    if (isMulti) html += '<span class="q-hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>До ' + q.multi + '</span>';
    if (isOrder) html += '<span class="q-hint q-hint--order"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>Расставь</span>';
    html +=   '<h2 class="q-title">' + escapeHtml(q.q) + '</h2>';

    if (q.img) html += '<img class="q-image" src="./' + q.img + '" alt="" onerror="this.style.display=\'none\';">';

    if (isOrder) html += '<div class="q-order-hint">Кликай по вариантам — 1, 2, 3... Первое место — самое важное.</div>';
    if (isMulti) html += '<span class="q-counter" id="qCounter">Выбрано: ' + selected.length + ' / ' + q.multi + '</span>';
    if (isOrder) html += '<span class="q-counter" id="qCounter">Выбрано: ' + selected.length + ' / ' + q.a.length + '</span>';

    html += '<div class="q-answers">';
    q.a.forEach(function(ans, idx) {
      var isSel = selected.indexOf(idx) !== -1;
      var cls = 'q-answer';
      if (isMulti) cls += ' q-answer--multi';
      if (isOrder) cls += ' q-answer--order';
      if (isSel) cls += ' selected';
      if (isOrder) {
        var num = selected.indexOf(idx) + 1;
        html += '<button type="button" class="' + cls + '" data-idx="' + idx + '">';
        html +=   '<span class="q-order-num">' + (isSel ? num : '•') + '</span>';
        html +=   '<span>' + escapeHtml(ans.t) + '</span>';
        html += '</button>';
      } else {
        var locked = isMulti && !isSel && selected.length >= q.multi;
        if (locked) cls += ' is-locked';
        html += '<button type="button" class="' + cls + '" data-idx="' + idx + '">';
        html +=   '<span class="q-radio"></span>';
        html +=   '<span>' + escapeHtml(ans.t) + '</span>';
        html += '</button>';
      }
    });
    html += '</div></div>';

    html += '<div class="test-nav">';
    html +=   '<button type="button" class="btn-nav btn-prev" id="prevBtn"' + (state.current === 0 ? ' disabled' : '') + '>';
    html +=     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Назад';
    html +=   '</button>';
    var isLast = state.current === total - 1;
    var noAnswer = selected.length === 0;
    html +=   '<button type="button" class="btn-nav btn-next" id="nextBtn"' + (noAnswer ? ' disabled' : '') + '>';
    html +=     (isLast ? 'Завершить' : 'Далее');
    html +=     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>';
    html +=   '</button>';
    html += '</div>';

    root.innerHTML = html;

    var nextBtn = document.getElementById('nextBtn');
    var counter = document.getElementById('qCounter');

    root.querySelectorAll('.q-answer').forEach(function(el) {
      el.addEventListener('click', function() {
        var idx = parseInt(el.getAttribute('data-idx'), 10);
        var arr = state.answers[state.current];

        if (isOrder) {
          var pos = arr.indexOf(idx);
          if (pos === -1) arr.push(idx); else arr.splice(pos, 1);
          root.querySelectorAll('.q-answer--order').forEach(function(a) {
            var i = parseInt(a.getAttribute('data-idx'), 10);
            var num = arr.indexOf(i) + 1;
            a.classList.toggle('selected', num > 0);
            var numEl = a.querySelector('.q-order-num');
            if (numEl) numEl.textContent = num > 0 ? num : '•';
          });
          if (counter) counter.textContent = 'Выбрано: ' + arr.length + ' / ' + q.a.length;
          if (nextBtn) nextBtn.disabled = arr.length !== q.a.length;
        } else if (isMulti) {
          var posM = arr.indexOf(idx);
          if (posM === -1) {
            if (arr.length >= q.multi) return;
            arr.push(idx);
          } else arr.splice(posM, 1);
          root.querySelectorAll('.q-answer--multi').forEach(function(a) {
            var i = parseInt(a.getAttribute('data-idx'), 10);
            var sel = arr.indexOf(i) !== -1;
            var locked = !sel && arr.length >= q.multi;
            a.classList.toggle('selected', sel);
            a.classList.toggle('is-locked', locked);
          });
          if (counter) counter.textContent = 'Выбрано: ' + arr.length + ' / ' + q.multi;
          if (nextBtn) nextBtn.disabled = arr.length === 0;
        } else {
          state.answers[state.current] = [idx];
          root.querySelectorAll('.q-answer').forEach(function(a) { a.classList.remove('selected'); });
          el.classList.add('selected');
          if (nextBtn) nextBtn.disabled = false;
        }
      });
    });

    var prevBtn = document.getElementById('prevBtn');
    if (prevBtn) prevBtn.addEventListener('click', function() {
      if (state.current > 0) { state.current--; renderQuestion(); scrollTop(); }
    });
    if (nextBtn) nextBtn.addEventListener('click', function() {
      if (state.answers[state.current].length === 0) return;
      if (state.current < total - 1) { state.current++; renderQuestion(); scrollTop(); }
      else finishTest();
    });
  }

  function finishTest() {
    state.scores = calculateScores();
    state.flags = collectFlags();
    var res = determineMovie(state.scores, state.flags);
    state.result = res.best;
    state.bestMatch = res.bestMatch;
    state.also = res.also;
    state.screen = 'result';
    renderResult();
    scrollTop();
  }

  function buildRadar(scores) {
    var size = 400, cx = 200, cy = 200, R = 130;
    var n = MOVIE_AXES.length;
    var angles = [];
    for (var i = 0; i < n; i++) angles.push(-90 + (360 / n) * i);
    var points = MOVIE_AXES.map(function(s, i) {
      var val = scores[s.id] || 0;
      var r = R * (val / 100);
      if (r < 4) r = 4;
      var rad = angles[i] * Math.PI / 180;
      return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad), color: s.color, angle: angles[i] };
    });
    var poly = points.map(function(p) { return p.x.toFixed(1) + ',' + p.y.toFixed(1); }).join(' ');
    var grid = '';
    [0.25, 0.5, 0.75, 1.0].forEach(function(lv) {
      var gp = angles.map(function(a) {
        var rad = a * Math.PI / 180;
        return (cx + R * lv * Math.cos(rad)).toFixed(1) + ',' + (cy + R * lv * Math.sin(rad)).toFixed(1);
      }).join(' ');
      grid += '<polygon points="' + gp + '" fill="none" stroke="#ece3fa" stroke-width="1"/>';
    });
    var axes = '';
    angles.forEach(function(a) {
      var rad = a * Math.PI / 180;
      axes += '<line x1="' + cx + '" y1="' + cy + '" x2="' + (cx + R * Math.cos(rad)).toFixed(1) + '" y2="' + (cy + R * Math.sin(rad)).toFixed(1) + '" stroke="#ece3fa" stroke-width="1"/>';
    });
    // Мягкая заливка внутри полигона (вместо цветных секторов)
    var fill = '<polygon points="' + poly + '" fill="#7c2fd4" fill-opacity="0.12"/>';
    var stroke = '<polygon points="' + poly + '" fill="none" stroke="#7c2fd4" stroke-width="2" stroke-linejoin="round" opacity="0.85"/>';
    var dots = '';
    points.forEach(function(p) { dots += '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="5" fill="' + p.color + '" stroke="#fff" stroke-width="2"/>'; });
    var labels = '';
    points.forEach(function(p, i) {
      var rad = p.angle * Math.PI / 180;
      var lx = cx + (R + 44) * Math.cos(rad);
      var ly = cy + (R + 32) * Math.sin(rad);
      var anchor = 'middle';
      if (Math.abs(Math.cos(rad)) > 0.5) anchor = Math.cos(rad) > 0 ? 'start' : 'end';
      var dy = 0;
      if (Math.sin(rad) > 0.5) dy = 16;
      if (Math.sin(rad) < -0.5) dy = -22;
      labels += '<text x="' + lx.toFixed(1) + '" y="' + (ly + dy).toFixed(1) + '" text-anchor="' + anchor + '" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#7c2fd4">' + MOVIE_AXES[i].name + '</text>';
      labels += '<text x="' + lx.toFixed(1) + '" y="' + (ly + dy + 15).toFixed(1) + '" text-anchor="' + anchor + '" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#a898c2">' + scores[MOVIE_AXES[i].id] + '%</text>';
    });
    return '<svg viewBox="-90 -40 580 480" xmlns="http://www.w3.org/2000/svg">' + grid + axes + fill + stroke + dots + labels + '</svg>';
  }

  function renderResult() {
    var data = state.result;
    var scores = state.scores;

    var kindMap = { 'фильм': 'Фильм', 'сериал': 'Сериал', 'аниме': 'Аниме', 'мультсериал': 'Мультсериал' };
    var kind = kindMap[data.kind] || 'Фильм';

    var html = '';
    html += '<div class="result-card">';
    html += '<div class="result-body">';
    html +=   '<span class="result-badge">Тебе стоит посмотреть</span>';
    html +=   '<span class="result-kind">' + kind + '</span>';
    html +=   '<h1 class="result-title" style="margin-top:16px">' + escapeHtml(data.name) + '</h1>';
    html +=   '<p class="result-tagline">«' + escapeHtml(data.tagline) + '»</p>';
    html +=   '<div class="result-meta">';
    html +=     '<span class="result-meta-item">' + escapeHtml(data.country) + '</span>';
    html +=     '<span class="result-meta-item">' + data.year + '</span>';
    html +=   '</div>';
    html +=   '<div class="score-display">';
    html +=     '<span class="score-number">' + state.bestMatch + '%</span>';
    html +=     '<span class="score-suffix">совпадение</span>';
    html +=   '</div>';
    html +=   '<div class="result-percent-wrap"><div class="result-percent">Нравится <b>' + escapeHtml(data.rating) + '</b> зрителей, которые смотрели</div></div>';
    html +=   '<div class="result-desc">';
    data.desc.forEach(function(p) { html += '<p>' + escapeHtml(p) + '</p>'; });
    html +=   '</div>';
    html +=   '<div class="result-actors"><b>В главных ролях:</b> ' + data.actors.map(escapeHtml).join(', ') + '</div>';

    html +=   '<div class="profile-box">';
    html +=     '<div class="profile-box-title">Твой профиль по 6 осям</div>';
    html +=     '<div class="profile-grid">';
    html +=       '<div class="profile-radar">' + buildRadar(scores) + '</div>';
    html +=       '<div class="profile-bars">';
    MOVIE_AXES.forEach(function(s) {
      var val = scores[s.id] || 0;
      html += '<div class="profile-bar">';
      html +=   '<div class="profile-bar-head">';
      html +=     '<span class="profile-bar-name"><span class="profile-bar-dot" style="background:' + s.color + '"></span>' + s.name + '</span>';
      html +=     '<span class="profile-bar-pct">' + val + '%</span>';
      html +=   '</div>';
      html +=   '<div class="profile-bar-track"><div class="profile-bar-fill" data-pct="' + val + '" style="background:' + s.color + '"></div></div>';
      html += '</div>';
    });
    html +=       '</div>';
    html +=     '</div>';
    html +=   '</div>';

    if (state.also && state.also.length) {
      html +=   '<div class="also-block">';
      html +=     '<div class="also-block-title">';
      html +=       '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>';
      html +=       'Также вам могут понравиться';
      html +=     '</div>';
      html +=     '<div class="also-grid">';
      state.also.forEach(function(item) {
        var p = item.movie;
        html += '<div class="also-card">';
        html +=   '<div class="also-card-kind">' + (kindMap[p.kind] || 'Фильм') + '</div>';
        html +=   '<div class="also-card-name">' + escapeHtml(p.name) + '</div>';
        html +=   '<div class="also-card-match">' + item.match + '% совпадение</div>';
        html += '</div>';
      });
      html +=     '</div>';
      html +=   '</div>';
    }

    html +=   '<div class="result-actions">';
    html +=     '<button type="button" class="btn-res primary" id="againBtn">';
    html +=       '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Пройти ещё раз';
    html +=     '</button>';
    html +=     '<button type="button" class="btn-res outline" id="shareBtn">';
    html +=       '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>Поделиться';
    html +=     '</button>';
    html +=     '<button type="button" class="btn-res outline" id="saveBtn">';
    html +=       '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>Сохранить';
    html +=     '</button>';
    html +=     '<a href="catalog.html#tests" class="btn-res outline">';
    html +=       '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>К тестам';
    html +=     '</a>';
    html +=   '</div>';
    html += '</div>';
    html += '</div>';

    html += '<div class="premium-rec">';
    html +=   '<div class="premium-rec-inner">';
    html +=     '<div class="premium-rec-head">';
    html +=       '<div class="premium-rec-head-icon">';
    html +=         '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/></svg>';
    html +=       '</div>';
    html +=       '<h3>Личные рекомендации</h3>';
    html +=     '</div>';
    html +=     '<p class="premium-rec-sub">Персональная подборка кино под твой вкус: что смотреть дальше, что похоже, а что расширит кругозор.</p>';
    html +=     '<div class="premium-locked">';
    html +=       '<div class="premium-locked-icon">';
    html +=         '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
    html +=       '</div>';
    html +=       '<p>Этот блок доступен только с Premium-подпиской. Открой расширенную подборку из 30+ фильмов и сериалов под твой профиль.</p>';
    html +=       '<button type="button" class="btn-premium-rec" id="premiumBtn">';
    html +=         'Оформить Premium';
    html +=         '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>';
    html +=       '</button>';
    html +=     '</div>';
    html +=   '</div>';
    html += '</div>';

    root.innerHTML = html;

    setTimeout(function() {
      root.querySelectorAll('.profile-bar-fill').forEach(function(el) {
        el.style.width = el.getAttribute('data-pct') + '%';
      });
    }, 150);

    document.getElementById('againBtn').addEventListener('click', function() { renderIntro(); scrollTop(); });
    document.getElementById('shareBtn').addEventListener('click', shareResult);
    document.getElementById('saveBtn').addEventListener('click', saveResult);
    var pb = document.getElementById('premiumBtn');
    if (pb) pb.addEventListener('click', function() { window.location.href = './#premium'; });
  }

  async function shareResult() {
    var data = state.result;
    var url = location.origin + location.pathname + '?movie=' + data.id;
    var text = 'Мне стоит посмотреть «' + data.name + '» — ' + state.bestMatch + '% совпадение по MindTest. А ты?';
    if (navigator.share) {
      try { await navigator.share({ title: 'Мой результат — MindTest', text: text, url: url }); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
    try { await navigator.clipboard.writeText(text + '\n' + url); showToast('Ссылка скопирована'); }
    catch (e) { showToast('Не удалось поделиться'); }
  }

  function saveResult() {
    try {
      var key = 'mindtest_saved_results';
      var list = [];
      try { list = JSON.parse(localStorage.getItem(key) || '[]'); } catch (e) { list = []; }
      var data = state.result;
      list = list.filter(function(item) { return item.test !== 'movie'; });
      list.unshift({ test: 'movie', testName: 'Кино', result: data.id, resultName: data.name + ' (' + state.bestMatch + '%)', date: new Date().toISOString() });
      list = list.slice(0, 100);
      localStorage.setItem(key, JSON.stringify(list));
      showToast('Результат сохранён');
    } catch (e) { showToast('Не удалось сохранить'); }
  }

  if (typeof MOVIE_ALL_QUESTIONS === 'undefined' || !Array.isArray(MOVIE_ALL_QUESTIONS) || MOVIE_ALL_QUESTIONS.length === 0) {
    root.innerHTML = '<div style="padding:60px 20px; text-align:center; color:#7e6b94;">Не удалось загрузить данные теста. Проверьте файл <b>movie-data.js</b>.</div>';
    return;
  }
  renderIntro();
})();
</script>
